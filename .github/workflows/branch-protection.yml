name: Branch Protection Guard

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-audit-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scaffold carrier docs
        run: ./scripts/scaffold_carriers.sh

      - name: Run data integrity test suite
        run: ./scripts/verify_data.sh
